[package]
name = "randobooru"
version = "26.1.1-alpha"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serenity = { version = "0.12.5", default-features = false, features = ["builder", "client", "gateway", "model", "native_tls_backend"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
toml = "1.1.8"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net", "io-util"] }
urlencoding = "2.1.3"

[build-dependencies]
toml = "1.1.8"
